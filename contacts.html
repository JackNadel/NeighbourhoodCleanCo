<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contacts — Neighbourhood Clean Co.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #2F80ED; --blue-dark: #1C60B3; --blue-light: #EBF5FF;
    --green: #27AE60; --green-light: #E8F8EF;
    --bg: #F7F9FB; --white: #ffffff; --text: #1F2937;
    --muted: #6B7280; --border: #E5E7EB; --radius: 12px; --radius-sm: 8px;
  }
  body { font-family: 'DM Sans', sans-serif; color: var(--text); background: var(--bg); font-size: 16px; -webkit-font-smoothing: antialiased; min-height: 100vh; }

  /* LOGIN */
  .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .login-card { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 36px 28px; max-width: 340px; width: 100%; text-align: center; }
  .login-logo { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 16px; color: var(--blue); margin-bottom: 20px; }
  .login-logo span { color: var(--green); }
  .login-card input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 15px; font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 12px; }
  .login-card input:focus { border-color: var(--blue); }
  .login-btn { width: 100%; background: var(--blue); color: var(--white); border: none; padding: 13px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; }
  .login-btn:hover { background: var(--blue-dark); }
  .login-error { font-size: 13px; color: #ef4444; margin-top: 8px; display: none; }

  /* APP */
  .app { display: none; }

  /* HEADER */
  .header { background: var(--white); border-bottom: 1px solid var(--border); padding: 16px 20px; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .header-logo { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px; color: var(--blue); }
  .header-logo span { color: var(--green); }
  .signout-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif; }

  /* SEARCH */
  .search-wrap { position: relative; }
  .search-wrap input { width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px 12px 40px; font-size: 16px; font-family: 'DM Sans', sans-serif; outline: none; background: var(--bg); }
  .search-wrap input:focus { border-color: var(--blue); background: var(--white); }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; pointer-events: none; }

  /* RESULTS */
  .main { padding: 16px 20px; }
  .results-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }

  .contact-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
  .contact-name { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }

  .contact-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
  .contact-row:last-child { border-bottom: none; padding-bottom: 0; }
  .contact-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .contact-phone { font-size: 18px; font-weight: 700; color: var(--blue); text-decoration: none; letter-spacing: 0.02em; }
  .contact-phone:hover { color: var(--blue-dark); }
  .contact-email { font-size: 14px; color: var(--text); text-decoration: none; }
  .contact-email:hover { color: var(--blue); }
  .contact-address { font-size: 13px; color: var(--muted); }

  .sms-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--green-light); color: var(--green); border: none; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; text-decoration: none; margin-top: 10px; }

  .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); font-size: 14px; }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--white); padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; display: none; z-index: 999; }
  .toast.show { display: block; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">💧 Neighbourhood <span>Clean Co.</span></div>
    <input type="password" id="password-input" placeholder="Enter password" onkeydown="if(event.key==='Enter') login()" />
    <button class="login-btn" onclick="login()">Sign In</button>
    <p class="login-error" id="login-error">Incorrect password.</p>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="header">
    <div class="header-top">
      <div class="header-logo">💧 Neighbourhood <span>Clean Co.</span></div>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" id="search-input" placeholder="Search by name..." oninput="handleSearch()" autocomplete="off" />
    </div>
  </div>

  <div class="main">
    <div class="results-label" id="results-label">All contacts</div>
    <div id="results-container">
      <div class="empty-state">
        <div class="empty-icon">👥</div>
        <div>Loading contacts...</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://gzrvfylugewtfjhiqjcz.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6cnZmeWx1Z2V3dGZqaGlxamN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NDYyNjIsImV4cCI6MjA5MzMyMjI2Mn0.FYwcZDDKbxkv64t0mAzKAbiJqxajY2SDNkx3deP0Mn0';
  const PASSWORD = 'NCC2025admin!';

  let allContacts = [];
  let searchTimer = null;

  function login() {
    const val = document.getElementById('password-input').value;
    if (val === PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadContacts();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  }

  function signOut() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('password-input').value = '';
    document.getElementById('search-input').value = '';
  }

  async function loadContacts() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/contacts?order=last_name.asc,first_name.asc&limit=200`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      });
      allContacts = await res.json();
      renderContacts(allContacts);
    } catch (err) {
      document.getElementById('results-container').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div>Failed to load contacts.</div></div>';
    }
  }

  function handleSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      if (!query) {
        renderContacts(allContacts);
        document.getElementById('results-label').textContent = 'All contacts';
        return;
      }
      const filtered = allContacts.filter(c =>
        (c.first_name + ' ' + c.last_name).toLowerCase().includes(query) ||
        c.last_name.toLowerCase().startsWith(query) ||
        c.first_name.toLowerCase().startsWith(query)
      );
      document.getElementById('results-label').textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''} for "${query}"`;
      renderContacts(filtered);
    }, 200);
  }

  function renderContacts(contacts) {
    const container = document.getElementById('results-container');
    if (!contacts || contacts.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div>No contacts found.</div></div>';
      return;
    }

    container.innerHTML = contacts.map(c => {
      const fullAddress = [c.street_address, c.city, c.postal_code].filter(Boolean).join(', ');
      const phoneClean = c.phone ? c.phone.replace(/\D/g, '') : '';
      return `
        <div class="contact-card">
          <div class="contact-name">${c.first_name} ${c.last_name}</div>
          <div class="contact-row">
            <span class="contact-label">Phone</span>
            <a class="contact-phone" href="tel:${phoneClean}">${c.phone}</a>
          </div>
          ${c.email ? `<div class="contact-row">
            <span class="contact-label">Email</span>
            <a class="contact-email" href="mailto:${c.email}">${c.email}</a>
          </div>` : ''}
          ${fullAddress ? `<div class="contact-row">
            <span class="contact-label">Address</span>
            <span class="contact-address">${fullAddress}</span>
          </div>` : ''}
          <a class="sms-btn" href="sms:${phoneClean}">💬 Send Text</a>
        </div>`;
    }).join('');

    document.getElementById('results-label').textContent = document.getElementById('search-input').value
      ? document.getElementById('results-label').textContent
      : `All contacts (${contacts.length})`;
  }
</script>
</body>
</html>
